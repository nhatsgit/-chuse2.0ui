<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Điều khiển quy trình Base</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Concept: công cụ cấu hình quy trình. Thanh bên gọn, vùng làm việc hai cột (các bước | việc của bước).
   Mỗi bước trả lời "bước này làm gì?" bằng công tắc; chỉ việc được bật mới mở phần cài đặt.
   Nhấn một sắc xanh lam đậm; xanh/hổ phách/đỏ chỉ dành cho trạng thái. */
/* Bộ giao diện CRCK ("Thẻ nhóm CRCK" của CRCK ERP): xanh lá thương hiệu, vạch vàng dưới thanh trên, nền xám xanh nhạt.
   Biến CRCK (--brand, --mau-card, cặp màu trạng thái ...) ở đây; các biến cũ của trang (--accent, --surface ...) ánh xạ sang. */
:root{
  --brand:#2f7a3d; --brand-600:#286d35; --brand-700:#1f5a2b; --brand-50:#f2f8f3; --brand-100:#e2f0e5; --brand-200:#c5e0cc;
  --gold:#cda852; --gold-700:#85620f; --gold-100:#f6edd3; --gold-50:#fbf7ea;
  --mau-ink:#16221a; --ink-phu:#39473e; --muted:#56645a; --faint:#66736b;
  --mau-line:#e1e6e2; --vach:#edf0ed; --page:#f3f5f2; --mau-card:#fff; --soft:#f7f9f7; --hover-bg:#e6ece7; --row-hover:#f5f9f6; --border-strong:#cfd8d1;
  --ok-bg:#e2f0e5; --ok-fg:#1d6430; --warn-bg:#fcefd5; --warn-fg:#7f4d00; --bad-bg:#fbe8e5; --bad-fg:#b42318;
  --info-bg:#e5edf3; --info-fg:#34556c; --gray-bg:#eceeec; --gray-fg:#4b574f;
  --sh-1:0 1px 2px rgba(17,38,23,.05),0 1px 1px rgba(17,38,23,.03);
  --sh-2:0 1px 2px rgba(17,38,23,.05),0 8px 24px -12px rgba(17,38,23,.18);
  --scrim:rgba(16,26,20,.4);
  --r-lg:16px; --r:12px; --r-sm:9px; --ck-rong-ben:244px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* biến cũ của trang -> CRCK */
  --bg:var(--page); --surface:var(--mau-card); --surface-2:var(--gray-bg); --line:var(--mau-line); --line-strong:var(--border-strong);
  --fg:var(--mau-ink);
  --accent:var(--brand); --accent-strong:var(--brand-700); --accent-soft:var(--brand-100); --on-accent:#fff;
  --ok:var(--ok-fg); --ok-soft:var(--ok-bg); --warn:var(--warn-fg); --warn-soft:var(--warn-bg); --bad:var(--bad-fg); --bad-soft:var(--bad-bg);
  --shadow:var(--sh-2);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#2f7a3d; --brand-600:#3a8a4b; --brand-700:#8fd39b; --brand-50:rgba(79,174,96,.10); --brand-100:rgba(79,174,96,.18); --brand-200:rgba(79,174,96,.38);
    --gold:#cda852; --gold-700:#e0c071; --gold-100:rgba(205,168,82,.20); --gold-50:rgba(205,168,82,.10);
    --mau-ink:#e6ece7; --ink-phu:#ccd6cf; --muted:#a9b5ad; --faint:#95a399;
    --mau-line:#2c3830; --vach:#233027; --page:#101612; --mau-card:#171f19; --soft:#1c251f; --hover-bg:#223026; --row-hover:#1e2a22; --border-strong:#3a483f;
    --ok-bg:rgba(79,174,96,.18); --ok-fg:#93d79f; --warn-bg:rgba(205,168,82,.18); --warn-fg:#e6c878; --bad-bg:rgba(240,96,76,.16); --bad-fg:#f4a597;
    --info-bg:rgba(120,160,195,.18); --info-fg:#b0cbe0; --gray-bg:#26302a; --gray-fg:#c3cdc6;
    --sh-1:0 0 0 1px rgba(0,0,0,.2); --sh-2:0 0 0 1px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.45);
    --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --brand:#2f7a3d; --brand-600:#3a8a4b; --brand-700:#8fd39b; --brand-50:rgba(79,174,96,.10); --brand-100:rgba(79,174,96,.18); --brand-200:rgba(79,174,96,.38);
    --gold:#cda852; --gold-700:#e0c071; --gold-100:rgba(205,168,82,.20); --gold-50:rgba(205,168,82,.10);
    --mau-ink:#e6ece7; --ink-phu:#ccd6cf; --muted:#a9b5ad; --faint:#95a399;
    --mau-line:#2c3830; --vach:#233027; --page:#101612; --mau-card:#171f19; --soft:#1c251f; --hover-bg:#223026; --row-hover:#1e2a22; --border-strong:#3a483f;
    --ok-bg:rgba(79,174,96,.18); --ok-fg:#93d79f; --warn-bg:rgba(205,168,82,.18); --warn-fg:#e6c878; --bad-bg:rgba(240,96,76,.16); --bad-fg:#f4a597;
    --info-bg:rgba(120,160,195,.18); --info-fg:#b0cbe0; --gray-bg:#26302a; --gray-fg:#c3cdc6;
    --sh-1:0 0 0 1px rgba(0,0,0,.2); --sh-2:0 0 0 1px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.45);
    --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--mau-ink);font:400 15px/1.55 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:15px}
h3{font-size:13px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);gap:16px;align-items:start;max-width:1440px;margin:0 auto}
.side{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:calc(100vh - 32px)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:14px;line-height:1.15}
.brand span{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.demo{font-size:11px;line-height:1.45;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}
.work{min-width:0;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.draft{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crumb{color:var(--muted);font-size:13px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent-strong);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.lg{padding:10px 16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-strong);cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent-strong)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:16px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead p{color:var(--muted);margin-top:2px;max-width:68ch}
.alerts{display:flex;flex-direction:column}
.alert{display:flex;gap:12px;padding:11px 16px;border-top:1px solid var(--line);align-items:flex-start}
.alert:first-child{border-top:0}
.sev{width:4px;align-self:stretch;border-radius:3px;flex:none;background:var(--muted)}
.sev.bad{background:var(--bad)}
.sev.warn{background:var(--warn)}
.alert .body{min-width:0;flex:1}
.alert .acts{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);flex:1;min-width:180px;max-width:340px}
.search input{border:0;background:transparent;padding:8px 0;width:100%;outline:none}
.search:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-strong);color:var(--on-accent)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.row{cursor:pointer}
.tbl tbody tr.row:hover{background:var(--surface-2)}
.tbl tbody tr.sel{background:var(--accent-soft)}
.tbl .num{text-align:right}
.name b{font-weight:600}
.sw{position:relative;display:inline-block;width:34px;height:20px;flex:none;vertical-align:middle}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line-strong);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw input:checked + span{background:var(--accent)}
.sw input:checked + span::after{transform:translateX(14px)}
.sw input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.detail-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.detail-head .grow{flex:1;min-width:200px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.ptab{padding:9px 14px;border:0;border-bottom:2px solid transparent;background:transparent;cursor:pointer;font-weight:500;color:var(--muted);margin-bottom:-1px}
.ptab:hover{color:var(--fg)}
.ptab[aria-selected="true"]{color:var(--accent-strong);border-bottom-color:var(--accent-strong)}
.dgrid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.rail{display:flex;flex-direction:column;padding:8px}
.rail-h{padding:8px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;text-align:left;padding:9px 10px;border-radius:9px;border:0;background:transparent;cursor:pointer;width:100%}
.step:hover{background:var(--surface-2)}
.step[aria-current="true"]{background:var(--accent-soft)}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.step[aria-current="true"] .n{background:var(--accent);color:var(--on-accent)}
.step b{display:block;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.step small{color:var(--muted);font-family:var(--mono);font-size:11px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);font-weight:500}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.step[aria-current="true"] .tag:not(.warn){background:var(--surface)}
.ed{display:flex;flex-direction:column}
.ed-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-sec{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.ed-sec:last-child{border-bottom:0}
.ed-sec>header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ed-sec>header h3{font-size:14px}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.cap{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.cap:hover{border-color:var(--line-strong)}
.cap.on{border-color:var(--accent-strong);background:var(--accent-soft)}
.cap b{display:block;font-weight:600;font-size:13px;line-height:1.3}
.cap span.d{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.help{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
input[type=text],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);min-width:0}
input.mono{font-family:var(--mono)}
textarea{resize:vertical;line-height:1.45}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ref{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ref select{flex:1;min-width:190px;width:auto}
.pv{padding:11px 13px;border-radius:9px;background:var(--surface-2);border:1px dashed var(--line-strong)}
.pv-l{font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.pv-t{overflow-wrap:anywhere;white-space:pre-wrap}
.pv-t em{font-style:normal;color:var(--bad);background:var(--bad-soft);border-radius:4px;padding:0 3px}
.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:10px}
.meter-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;gap:8px}
.meter-top b{font-weight:600}
.bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.meter.warn .bar i{background:var(--warn)}
.meter.bad .bar i{background:var(--bad)}
.meter.off{opacity:.55}
.meter.off .bar i{background:var(--line-strong)}
.meter.bad .meter-top b{color:var(--bad)}
.meter.warn .meter-top b{color:var(--warn)}
.note{padding:9px 12px;border-radius:9px;font-size:13px;background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--accent-soft);color:var(--accent-strong)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note b{font-weight:600}
.note .cut{display:block;margin-top:4px;color:var(--fg);font-size:12px}
.notes{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;font-size:12px}
.seg button + button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:2px;padding:4px 3px 4px 10px;border-radius:8px;background:var(--surface-2);font-size:13px}
.fchip small{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:6px}
.fchip button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 5px;line-height:1.4;border-radius:5px;display:grid;place-items:center}
.fchip button:hover{color:var(--bad);background:var(--bad-soft)}
.picker{border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.picker .search{max-width:none;border:0;border-bottom:1px solid var(--line);border-radius:0}
.picker .search:focus-within{outline:0;background:var(--surface-2)}
.picklist{max-height:260px;overflow-y:auto;padding:6px}
.pick{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:7px;cursor:pointer}
.pick:hover{background:var(--surface-2)}
.pick input{margin-top:3px;accent-color:var(--accent-strong)}
.pick small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.vchips{display:flex;gap:6px;flex-wrap:wrap}
.vchip{padding:3px 9px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);font-size:12px;cursor:pointer}
.vchip:hover{border-color:var(--accent-strong);color:var(--accent-strong)}
.lt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:center}
.aicard{padding:11px 13px;border-radius:9px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;font-size:13px}
.aicard .k{color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.flow{list-style:none;margin:0;padding:8px 0}
.fl{display:flex;align-items:center;gap:10px;padding:7px 16px;position:relative;flex-wrap:wrap}
.fl .ind{display:inline-block;flex:none}
.fl .ft{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);flex:none;min-width:74px;text-align:center}
.fl.hook .ft{background:var(--accent);color:var(--on-accent)}
.fl.appr .ft{background:var(--accent-soft);color:var(--accent-strong)}
.fl.branch .ft,.fl.switch .ft{background:var(--warn-soft);color:var(--warn)}
.fl .fn{min-width:0;flex:1;overflow-wrap:anywhere}
.fl.hook .fn{font-weight:600}
.fl.branch .fn{font-weight:600}
.fl .fid{font-family:var(--mono);font-size:11px;color:var(--muted)}
.fl:hover{background:var(--surface-2)}
.dlist{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;font-weight:500;color:var(--muted)}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-strong)}

  .ck-ph-ico{width:42px;height:42px;border-radius:12px}
  .ck-ph-ico .ico{width:22px;height:22px}
  .ck-ph-chu{flex:1 1 0}
  .ck-ph h1{font-size:21px}
  .ck-ph p{font-size:13px}
  .ck-ph-nut{width:100%;margin-left:0}
  .ck-ph-nut > .ck-btn{flex:1 1 auto;min-height:44px}
  .ck-dai{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ck-o{padding:10px 12px;gap:8px}
  .ck-o > i{display:none}
  .ck-o .nh{font-size:13px}
  .ck-o .gt{font-size:19px}
  .ck-o .ph{font-size:12px;line-height:1.35}
  .ck-hang-loc .search{max-width:none;flex-basis:100%}
  .ck-bang.the-dt{border:0;background:none;box-shadow:none;overflow:visible}
  .ck-bang.the-dt table,.ck-bang.the-dt tbody,.ck-bang.the-dt tr,.ck-bang.the-dt td{display:block;width:100%}
  .ck-bang.the-dt thead{display:none}
  .ck-bang.the-dt tr{margin-bottom:10px;padding:10px 14px;background:var(--mau-card);border:1px solid var(--mau-line);border-radius:var(--r);box-shadow:var(--sh-1)}
  .ck-bang.the-dt td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0;border:0;text-align:right}
  .ck-bang.the-dt td::before{content:attr(data-nhan);flex:none;color:var(--muted);text-align:left;font-size:13px}
  .ck-bang.the-dt td.name{display:block;text-align:left}
  .ck-bang.the-dt td.name::before{display:none}
  .ck-bang.the-dt td.hide-s{display:none}
}
@media (max-width:360px){.ck-ph h1{font-size:19px}}

/* ================= thành phần cũ theo kiểu CRCK ================= */
.ck-noi :focus-visible,.drawer :focus-visible,.ck-ben :focus-visible{outline:3px solid var(--brand-200);outline-offset:2px}
.btn{height:38px;padding:0 15px;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--mau-line);background:var(--mau-card);color:var(--mau-ink);font:600 14.5px/1.2 var(--font);box-shadow:0 1px 1px rgba(17,38,23,.04)}
.btn:hover{border-color:var(--border-strong);background:var(--soft)}
.btn.primary{background:var(--brand);border-color:var(--brand-600);color:#fff;box-shadow:0 1px 2px rgba(31,90,43,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.btn.primary:hover{background:#1f5a2b;border-color:#1f5a2b}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--hover-bg);color:var(--mau-ink)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.lg{height:40px;padding:0 16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{border-radius:var(--r-lg);border-color:var(--mau-line);background:var(--mau-card);box-shadow:var(--sh-1)}
.card-h{border-bottom-color:var(--vach);padding:14px 16px}
.card-h h2{font-size:16px;font-weight:600}
.pill{height:24px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--gray-bg);color:var(--gray-fg)}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.bad{background:var(--bad-bg);color:var(--bad-fg)}
.pill.acc{background:var(--info-bg);color:var(--info-fg)}
.chip{border:1px solid var(--mau-line);background:var(--mau-card);color:var(--ink-phu);font:500 13.5px var(--font);padding:5px 12px}
.chip:hover{background:var(--hover-bg)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.ck-loc .chip{flex:none;height:32px;padding:0 14px;border:0;border-radius:8px;background:none;color:var(--ink-phu);font:500 14px var(--font);white-space:nowrap}
.ck-loc .chip:hover{background:var(--hover-bg)}
.ck-loc .chip[aria-pressed="true"]{background:var(--brand);color:#fff;font-weight:600}
.search{height:38px;border:1px solid var(--mau-line);border-radius:10px;background:var(--mau-card)}
.search:focus-within{outline:0;border-color:var(--brand-200);box-shadow:0 0 0 3px var(--brand-100)}
.search input[type=text],.search input[type=text]:focus{border:0;border-radius:0;box-shadow:none;background:transparent;padding:8px 0}
input[type=text],select,textarea{border-color:var(--mau-line);border-radius:10px;background:var(--mau-card)}
input[type=text]:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand-200);box-shadow:0 0 0 3px var(--brand-100)}
.tbl th{background:var(--soft);border-bottom:1px solid var(--mau-line);color:var(--muted);font-size:12.5px;letter-spacing:.03em;padding:10px 14px}
.tbl td{border-bottom:1px solid var(--vach);padding:10px 14px}
.tbl tbody tr.row:hover{background:var(--row-hover)}
.ptabs,.tabs{display:flex;gap:2px;flex-wrap:nowrap;border-bottom:1px solid var(--mau-line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.ptabs::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.ptab,.tab{flex:none;min-height:44px;padding:0 14px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--muted);font:500 14.5px var(--font);white-space:nowrap;cursor:pointer}
.ptab:hover,.tab:hover{color:var(--mau-ink);background:none}
.ptab[aria-selected="true"],.tab[aria-selected="true"]{color:var(--brand-700);border-bottom-color:var(--brand);font-weight:600;background:none}
.detail-head h1{font-size:22px;letter-spacing:-.015em}
.detail-head .grow{flex:1 1 360px}
.ck-vet span:first-child{flex:none}
.detail-head .ck-ph-ico{width:46px;height:46px;border-radius:13px}
.drawer{background:var(--mau-card)}
.alert{padding:12px 16px;border-top-color:var(--vach)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* chuỗi chức năng */
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chain li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.chain li.off{opacity:.55}
.chain .cn{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.chain .cb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.chain .ct{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chain .cacts{display:flex;gap:2px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.chain input.cond{font-size:12px}
input.cond.bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
@media (max-width:560px){.chain li{flex-wrap:wrap}.chain .cacts{width:100%;justify-content:flex-start}}

function fmtDate(k){
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  return k.replace('dd', pad(d.getDate())).replace('MM', pad(d.getMonth() + 1)).replace('yyyy', d.getFullYear());
}
function resolveTpl(tpl){
  const S = state.long ? Object.assign({}, SAMPLE, SAMPLE_LONG) : SAMPLE;
  const missing = [];
  const text = String(tpl || '').replace(/\{([^{}]+)\}/g, (m, k) => {
    if (/^(dd|MM|yyyy)/.test(k)) return fmtDate(k);
    if (Object.prototype.hasOwnProperty.call(S, k)) return S[k];
    missing.push(k); return '‹' + fname(k) + '›';
  });
  return {text, html: esc(text).replace(/‹([^›]+)›/g, '<em>$1</em>'), missing};
}
function meter(label, val, max, unit, off){
  const pct = Math.min(100, Math.round(val / max * 100));
  const cls = off ? 'off' : (val > max ? 'bad' : (val > max * 0.85 ? 'warn' : 'ok'));
  return '<div class="meter ' + cls + '"><div class="meter-top"><span>' + label + '</span><b>' + (off ? 'bước này không đăng' : val + ' / ' + max + ' ' + unit) + '</b></div><div class="bar"><i style="width:' + (off ? 100 : pct) + '%"></i></div></div>';
}
function previewHTML(tpl, useOffice){
  const r = resolveTpl(tpl), len = r.text.length, b = officeBytes(r.text);
  let out = '<div class="pv"><div class="pv-l">Tên phiếu với dữ liệu mẫu</div><div class="pv-t">' + (r.html || '<span class="muted">Chưa có khuôn tên</span>') + '</div></div>';
  out += '<div class="meters">' + meter('Tên phiếu trên Service', len, SERVICE_MAX, 'ký tự') + meter('Tên văn bản Office', b, OFFICE_MAX, 'byte', !useOffice) + '</div>';
  const n = [];
  if (r.missing.length) n.push('<div class="note bad"><b>Chưa có dữ liệu cho ' + r.missing.map(k => esc(fname(k))).join(', ') + '.</b> Thêm trường đó ở mục "Lưu dữ liệu phiếu" hoặc bỏ khỏi khuôn tên.</div>');
  if (len > SERVICE_MAX) n.push('<div class="note"><b>Dài hơn 255 ký tự Service cho phép.</b> Khi chạy, hệ thống tự cắt ở ranh giới từ:<span class="cut">' + esc(cutChars(r.text, SERVICE_MAX - 5)) + '</span></div>');
  if (useOffice && b > OFFICE_MAX) n.push('<div class="note"><b>Dài hơn 500 byte Office cho phép.</b> Office sẽ từ chối cả văn bản, nên hệ thống tự rút gọn còn ' + officeBytes(cutBytes(r.text, OFFICE_MAX - PAD)) + ' byte trước khi gửi.</div>');
  if (!n.length && r.text) n.push('<div class="note ok">Tên này gửi được nguyên văn' + (useOffice ? ' lên cả Service và Office.' : ' lên Service.') + '</div>');
  return out + '<div class="notes">' + n.join('') + '</div>';
}

/* ================= màn danh sách quy trình ================= */
function procRows(){
  const q = state.q.trim().toLowerCase();
  const list = P.filter(p => (state.grp === 'Tất cả' || p.g === state.grp) && (!q || (p.name + ' ' + p.g + ' ' + TYPES[p.e][0]).toLowerCase().includes(q) || String(p.svc).includes(q)));
  if (!list.length) return '<tr><td colspan="5"><div class="empty">Không có quy trình nào khớp "' + esc(state.q) + '".</div></td></tr>';
  return list.map(p => {
    const u = unset(p);
    let st;
    if (!p.on) st = '<span class="pill">Đang tắt</span>';
    else if (u) st = '<span class="pill warn"><span class="dot"></span>' + u + ' bước chưa cấu hình</span>';
    else if (p.err) st = '<span class="pill bad"><span class="dot"></span>Có lỗi gần đây</span>';
    else st = '<span class="pill ok"><span class="dot"></span>Đang chạy</span>';
    return '<tr class="row" data-act="open" data-pid="' + p.id + '"><td class="name" data-nhan="Quy trình"><b>' + esc(p.name) + '</b><div class="small muted">' + esc(p.g) + ' · ' + p.steps.length + ' bước</div></td>' +
      '<td class="hide-s" data-nhan="Loại xử lý"><span class="pill acc">' + TYPES[p.e][0] + '</span></td>' +
      '<td data-nhan="Tình trạng">' + st + '</td>' +
      '<td class="hide-s mono muted" data-nhan="Mã dịch vụ">' + p.svc + '</td>' +
      '<td data-nhan="Bật"><label class="sw" title="Bật hoặc tắt xử lý"><input type="checkbox" id="on-' + p.id + '" data-act="toggle" data-pid="' + p.id + '"' + (p.on ? ' checked' : '') + ' aria-label="Bật ' + esc(p.name) + '"><span></span></label></td></tr>';
  }).join('');
}

/* danh sách phẳng (có độ sâu d) -> cây lồng nhau */
function fcNest(list){
  let i = 0;
  function seq(depth){
    const out = [];
    while (i < list.length && list[i].d >= depth){
      if (list[i].d > depth){
        const par = out[out.length - 1];
        const kids = seq(list[i].d);
        if (par) par.kids = (par.kids || []).concat(kids); else out.push({t:'note', n:'', kids});
        continue;
      }
      out.push(Object.assign({}, list[i])); i++;
    }
    return out;
  }
  return seq(0);
}

  const qt = state.sqt || '*', pol = polFor(qt), date = state.sdate || '05/11/2026', a = allocDemo(SAMPLE_ROWS, date, pol), y = (vnD(date) || new Date()).getFullYear();
  if (pol.mau.indexOf('{so}') < 0) h += '<div class="note bad" style="margin-top:10px">Mẫu số phải có {so}.</div>';
  h += '<div class="card" style="margin-top:16px;padding:14px"><h3 style="margin-bottom:8px">Thử cấp số</h3><div class="row2"><div class="fld"><label for="r-sqt">Theo quy tắc của</label><select id="r-sqt" data-rb="sqt"><option value="*">Mọi quy trình</option>' + RULES.so.filter(r => r.qt !== '*').map(r => '<option value="' + r.qt + '"' + (r.qt === qt ? ' selected' : '') + '>' + esc((procById(r.qt) || {}).name || r.qt) + '</option>').join('') + '</select></div><div class="fld"><label for="r-sdate">Ngày ban hành</label><input type="text" id="r-sdate" class="mono" value="' + esc(date) + '"></div></div>';
  h += '<p class="small muted" style="margin:8px 0">Sổ Kế hoạch đã có: ' + SAMPLE_ROWS.filter(r => /^\d/.test(r.so_hieu) && r.loai_van_thu === 'Kế hoạch').map(r => '<span class="mono">' + esc(r.so_hieu) + '</span> (' + r.ngay_ban_hanh + ')').join(', ') + '</p>';
  h += '<div id="r-sout">' + (a.so ? '<div class="note ok">Số cấp: <b class="mono">' + esc(fmtSo(a.so, pol, 'KH', 'DU', y)) + '</b> — ' + esc(a.note) + '</div>' : '<div class="note bad">' + esc(a.note) + '</div>') + '</div></div>';

function rulesLich(){
  let h = '<section class="card"><div class="card-h"><h2>Lịch chạy</h2><span class="small muted">Tới giờ, chạy chuỗi chức năng trên mỗi dòng thoả điều kiện. Job đêm cũ giờ là 2 dòng ở đây.</span></div><div class="alerts" style="padding:0 16px 16px;display:flex;flex-direction:column;gap:12px">';
  RULES.lich.forEach((l, i) => {
    const err = condErr(l.dieu_kien);
    h += '<div class="card" style="padding:14px"><div class="inline" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><div><b>' + esc(l.ten) + '</b><div class="small muted">' + esc(l.loai) + ' lúc ' + esc(l.gio) + ' · ' + (l.qt === '*' ? 'mọi bảng văn thư đi' : esc((procById(l.qt) || {}).name || l.qt)) + ' · <span class="mono">' + esc(l.id) + '</span></div></div><label class="inline small" for="lich-on-' + i + '"><span class="sw"><input type="checkbox" id="lich-on-' + i + '" data-rb="lich" data-i="' + i + '" data-k="on"' + (l.on ? ' checked' : '') + '><span></span></span>' + (l.on ? 'Đang bật' : 'Đang tắt') + '</label></div>';
    h += '<div class="fld" style="margin-top:10px"><label for="lich-dk-' + i + '">Chạy trên dòng khi</label><input type="text" class="mono cond' + (err ? ' bad' : '') + '" id="lich-dk-' + i + '" data-rb="lich" data-i="' + i + '" data-k="dieu_kien" value="' + esc(l.dieu_kien) + '"><div class="small" id="lich-dke-' + i + '" style="margin-top:4px;color:var(--bad)">' + esc(err) + '</div></div>';
    h += '<div class="small" style="margin:6px 0 10px">' + l.chain.map(c => '<span class="tag">' + esc(c) + '</span>').join(' → ') + (l.sau ? ' → sau cùng: <span class="tag">' + esc(l.sau) + '</span>' : '') + '</div>';
    h += '<div class="inline"><button class="btn sm" type="button" data-act="lich-thu" data-i="' + i + '">' + icon('play') + 'Chạy thử (không ghi)</button></div></div>';
  });
  return h + '</div></section>';
}
function lichTry(i){
  const l = RULES.lich[i], c = condCompile(l.dieu_kien), pol = polFor(l.qt), rows = SAMPLE_ROWS.map(r => Object.assign({}, r));
  rows.sort((a, b) => (vnD(a.ngay_ban_hanh) || 9e15) - (vnD(b.ngay_ban_hanh) || 9e15));
  const hit = rows.filter(r => condEval(c, k => r[k]));
  let body = '<div class="note info" style="margin-bottom:12px">Chạy bóng trên ' + rows.length + ' dòng mẫu: đọc thật, không ghi Base hay sheet. ' + hit.length + ' dòng thoả điều kiện.</div>';
  if (!hit.length) body += '<div class="empty">Không dòng nào thoả điều kiện.</div>';
  const done = rows.filter(r => r.so_hieu);
  hit.forEach(r => {
    const tr = [];
    l.chain.forEach(ch => {
      if (/^cap_so/.test(ch)){ const a = allocDemo(done, r.ngay_ban_hanh, pol); r.so_hieu = fmtSo(a.so, pol, 'KH', 'DU', (vnD(r.ngay_ban_hanh) || new Date()).getFullYear()); done.push(r); tr.push(['ok', 'Cấp số theo ngày', r.so_hieu + ' — ' + a.note]); }
      else if (/^dat_gia_tri: luong/.test(ch)) tr.push(['ok', 'Đặt luồng', luongValue('chen_so')]);
      else if (/^dong_bo_truong/.test(ch)) tr.push(['skip', 'Đẩy lên Base', 'Chạy thử: ghi lại lệnh, không gửi (' + ch.split(': ')[1] + ')']);
      else tr.push(['ok', ch.split(': ')[0], ch.split(': ')[1] || '']);
    });
    body += '<h3 style="margin:12px 0 6px">Phiếu <span class="mono">' + r.root_id + '</span> · ' + esc(r.trich_yeu) + '</h3>' + traceHTML(tr);
  });
  if (l.sau) body += traceHTML([['ok', 'Sau cùng: ' + l.sau, 'Sắp theo ngày ban hành, đánh lại STT theo sổ']]);
  openDrawer('Chạy thử lịch', esc(l.ten), body);
}
function roleSuggest(pid){
  const p = procById(pid), fields = CAT[p.g] || [], ov = RULES.vaitro[pid] = RULES.vaitro[pid] || {};
  const words = s => new Set(String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 1));
  let n = 0;
  ROLES_UI.forEach(r => {
    if (ov[r[0]] || fields.some(f => f[0] === r[1])) return;
    const want = words(r[2] + ' ' + r[1].replace(/^service_/, '').replace(/_/g, ' '));
    let best = null, sc = 0;
    fields.forEach(f => { const have = words(f[1] + ' ' + f[0].replace(/^service_/, '').replace(/_/g, ' ')); const c = [...want].filter(w => have.has(w)).length / Math.max(want.size, 1); if (c > sc){ sc = c; best = f; } });
    if (best && sc >= 0.5){ ov[r[0]] = best[0]; n++; }
  });
  markDirty('rules:vaitro:' + pid);
  return n;
}

/* ---- sự kiện riêng của phần linh hoạt ---- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, p = curProc(), st = curStep();
  const ch = () => { if (!st.chain || !st.chainCustom) { st.chain = derivedChain(p, st).chain.map(x => Object.assign({}, x)); st.chainCustom = true; } return st.chain; };
  const touch = () => { markDirty(p.id + ':' + state.si + ':chain'); rerenderEditor(); };
  switch (act){
    case 'ch-up': { const c = ch(), i = +a.dataset.i; if (i > 0) [c[i - 1], c[i]] = [c[i], c[i - 1]]; touch(); break; }
    case 'ch-down': { const c = ch(), i = +a.dataset.i; if (i < c.length - 1) [c[i + 1], c[i]] = [c[i], c[i + 1]]; touch(); break; }
    case 'ch-tat': { const c = ch(), i = +a.dataset.i; c[i].tat = !c[i].tat; touch(); break; }
    case 'ch-rm': { const c = ch(); c.splice(+a.dataset.i, 1); touch(); break; }
    case 'ch-add': { const c = ch(), k = $('#ch-add').value; c.push({loai:k}); touch(); toast('Đã thêm "' + ACT[k][0] + '" vào cuối chuỗi'); break; }
    case 'ch-reset': st.chainCustom = false; st.chain = null; touch(); break;
    case 'shadowview': shadowDrawer(p); break;
    case 'replay': doReplay(+a.dataset.i, a.dataset.all === '1'); break;
    case 'rtab': state.rtab = a.dataset.v; render(); break;
    case 'r-goiy': { const pid = state.rproc || P.find(x => x.e === 'vanthu').id; const n = roleSuggest(pid); render(); toast(n ? 'Đã gợi ý ' + n + ' vai trò từ form Base — kiểm lại rồi xuất bản' : 'Không có vai trò nào cần gợi ý thêm'); break; }
    case 'r-luong-add': RULES.luong.push({gia_tri:'', hanh_vi:'di', dong_nghia:''}); markDirty('rules:luong'); render(); break;
    case 'r-luong-rm': RULES.luong.splice(+a.dataset.i, 1); markDirty('rules:luong'); render(); break;
    case 'r-so-add': { const used = new Set(RULES.so.map(r => r.qt)), pr = P.find(x => x.e === 'vanthu' && !used.has(x.id)); if (!pr){ toast('Quy trình văn thư nào cũng đã có quy tắc riêng'); break; } RULES.so.push(Object.assign({}, polFor('*'), {qt:pr.id})); markDirty('rules:so'); render(); break; }
    case 'r-so-rm': RULES.so.splice(+a.dataset.i, 1); markDirty('rules:so'); render(); break;
    case 'lich-thu': if (condErr(RULES.lich[+a.dataset.i].dieu_kien)) toast('Sửa điều kiện trước khi chạy thử'); else lichTry(+a.dataset.i); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, p = curProc(), st = curStep();
  if (t.dataset.cb === 'custom'){
    if (t.checked){ st.chain = derivedChain(p, st).chain.map(x => Object.assign({}, x)); st.chainCustom = true; } else { st.chainCustom = false; st.chain = null; }
    markDirty(p.id + ':' + state.si + ':chain'); rerenderEditor(); return;
  }
  if (t.dataset.cb === 'cond'){ st.chain[+t.dataset.i].dieu_kien = t.value.trim(); markDirty(p.id + ':' + state.si + ':chain'); rerenderEditor(); return; }
  const rb = t.dataset.rb; if (!rb) return;
  const v = t.type === 'checkbox' ? t.checked : t.value;
  if (rb === 'rproc'){ state.rproc = v; render(); return; }
  if (rb === 'sqt'){ state.sqt = v; render(); return; }
  if (rb === 'role'){ const pid = state.rproc || P.find(x => x.e === 'vanthu').id; const ov = RULES.vaitro[pid] = RULES.vaitro[pid] || {}; if (v.trim()) ov[t.dataset.k] = v.trim(); else delete ov[t.dataset.k]; markDirty('rules:vaitro:' + pid + ':' + t.dataset.k); render(); return; }
  if (rb === 'luong' || rb === 'so' || rb === 'lich'){ RULES[rb][+t.dataset.i][t.dataset.k] = v; markDirty('rules:' + rb + ':' + t.dataset.i + ':' + t.dataset.k); render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'r-ltest'){ state.ltest = t.value; const o = $('#r-lout'); if (o) o.innerHTML = luongTestHTML(); return; }
  if (t.id === 'r-sdate'){ state.sdate = t.value; return; }
  if (t.classList.contains('cond')){ const m = condErr(t.value); t.classList.toggle('bad', !!m); const id = t.id && t.id.replace('lich-dk-', 'lich-dke-'); const o = id && $('#' + id); if (o) o.textContent = m; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'r-sdate'){ e.preventDefault(); state.sdate = e.target.value; render(); } });
document.addEventListener('focusout', e => { if (e.target.id === 'r-sdate' && state.sdate !== undefined){ setTimeout(render, 0); } });

const INITIAL = snapshot(), INIT_ISSUES = JSON.stringify(state.issues);
const restored = loadSaved();
if (!state.versions.length) state.versions = [{n:1, at:nowStr(), count:0, snap:INITIAL}];
window.addEventListener('hashchange', route);
route();
updateDraft();
if (restored && state.dirty.size) toast('Đã mở lại ' + state.dirty.size + ' thay đổi chưa xuất bản trên trình duyệt này');
})();
</script>
